<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!-- Cacat 7.5 v2.1: user-scalable=no + maximum-scale=1 mematikan cubit-perbesar
     (gagal WCAG 1.4.4). Dicabut di v3 — pendamping sering perlu memperbesar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DEEEFF">
<meta name="description" content="Alat ukur ergonomi kognitif berbasis permainan untuk siswa sekolah dasar.">
<title>CognoKids Explorer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%233B67F0'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle'%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
<!-- Tanpa satu pun sumber CDN: seluruh gaya dan skrip berasal dari repo ini sendiri,
     sehingga service worker bisa menyimpan aplikasi secara utuh untuk dipakai
     di sekolah tanpa sinyal. -->
<!-- Font dimuat lebih awal supaya teks tidak sempat tampil dengan font sistem lalu
     melompat ganti — pada layar penuh teks besar, lompatan itu sangat terlihat.
     crossorigin wajib ada meski berkasnya seasal: tanpa itu preload-nya diabaikan
     dan berkasnya diunduh dua kali. -->
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/nunito-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/fredoka-latin.woff2" crossorigin>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="app" role="main"></div>
<div id="live" aria-live="polite" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
