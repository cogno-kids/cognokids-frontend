name: Uji

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  uji:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Tanpa dependensi dan tanpa build step — tidak ada npm install.
      - name: Jalankan uji
        run: node --test test/*.test.mjs

      # Penjaga tambahan yang murah: memastikan setiap modul JS terdaftar di sw.js.
      # Kegagalannya baru terasa saat perangkat sudah offline di sekolah, jadi lebih baik
      # tertangkap di sini. (Sudah tercakup uji di atas; langkah ini menegaskan niatnya.)
      - name: Ringkasan
        if: always()
        run: |
          echo "Berkas uji:"
          ls -1 test/*.test.mjs
